status_note: "🚧 IN PROGRESS (2/4) — m1+m2 done. m2: Review inbox (3 buckets 待提交/需接管/填表中 from new GET /autopilot/review) + nav Review tab with polled badge + 'bank an answer' flywheel (POST /autopilot/bank-answer writes the applier-shape history the draft reader actually consumes). Key fix: persisted terminal_outcome+escalation_code on the session (schema +2 fields, machine writes on settle) so bucketing is restart-safe and the review endpoint no longer needs per-session getStatus. Deep per-field actions stay on the existing Apply page; Review routes there. Review (Plan agent): 1 HIGH (restart mis-bucket) + 3 LOW fixed; flywheel write-shape verified; apply-sessions-store 58/58 regression. 4/4 review smoke + vite build + lint. Next: m3 Jobs downgrade.\n\n(m1 done. Global AutopilotToggle in the Career header (poll /autopilot/status, optimistic ON/OFF) + new Dashboard landing page (status card + 4 funnel cards 候选/填表中/待批准/已提交 from /autopilot/feed + activity stream of per-candidate outcomes). Dashboard is the new landing tab (RootRedirect→dashboard, first nav tab). Consumes 10-autopilot-engine endpoints — engine room is COMPLETE so this is live, not stubbed. Review (Plan agent): 2 MEDIUM (unmounted setState; stale rollback) + 1 LOW (frozen spinner icon) fixed; no critical/high; redirect loop-safe. 5/5 dashboard smoke + vite build clean + lint. (tsc -b has pre-existing Apply.tsx errors, not ours.) Next: m2 Review gate queue. 详见 ../UI-LAYOUT.md。"
