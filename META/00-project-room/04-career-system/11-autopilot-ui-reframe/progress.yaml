milestones:
  - id: "m1-global-control-bar-and-dashboard"
    name: "全局 Autopilot 控制条 + Dashboard 控制台(状态卡 + 4 漏斗 + 活动流)"
    status: completed
    actual_files:
      - "src/career/AutopilotToggle.tsx (~130 行) + autopilot-toggle.css"
      - "src/career/Dashboard.tsx (~230 行) + dashboard.css"
      - "src/CareerApp.tsx (改: header toggle + /dashboard route + RootRedirect→dashboard)"
      - "src/career/CareerNav.tsx (改: Dashboard 设为首个主 tab)"
      - "src/career.css (改: .c-header-right)"
      - "scripts/smoke-dashboard-page.mjs (~140 行, 5 tests)"
    actual_lines: 560
    review_findings:
      - "[MEDIUM] toggle 的 post-fetch/rollback 无 mounted 守卫 → 卸载后 setState → 修:两组件加 mountedRef,卸载置 false 并守卫所有 setState"
      - "[MEDIUM] rollback 用 click 时的 stale snapshot 覆盖 poller 刚拉到的计数 → 修:functional setState 只回滚 enabled"
      - "[LOW] 填表中卡片用 Loader2(静态不转)像坏掉 → 修:换 PenLine 图标"
      - "[VERIFIED] RootRedirect 不会死循环(VALID_TABS 全有对应 route);feed/funnel null 安全;AbortController+interval 清理正确;engine_disabled 禁用开关"
      - "[NOTE] header toggle 与 Dashboard 状态卡是两个独立 poller,Dashboard 页同时存在时最多 30s 短暂不同步 — m1 可接受,未来可提共享 store"
      - "[PRE-EXISTING] tsc -b 在 Apply.tsx 有历史报错(非本次文件);项目走 vite build(esbuild 无类型检查),vite build 干净"
    estimated_files:
      - "src/CareerApp.tsx"
      - "src/career/CareerNav.tsx"
      - "src/career/Dashboard.tsx"
      - "src/career/dashboard.css"
      - "scripts/smoke-dashboard-page.mjs"
    estimated_lines: 320
    depends_on: []
    complexity_flags: ["design_decisions"]
    open_questions: []
    description: |
      新建 Dashboard 落地页 + 顶栏全局 Autopilot 开关。消费 10-autopilot-engine
      的 /status /enable /disable /feed。布局见 UI-LAYOUT §3.1 + §2。

      Files:
        - src/CareerApp.tsx(改):
          · 顶栏右侧加 AutopilotToggle:读 GET /autopilot/status 显示 ON/OFF +
            "扫描 N 源 · 上次 Xh 前";点击 POST /enable|/disable;乐观更新 + 失败回滚
          · 路由 / → /career/dashboard;新增 <Route path="dashboard">
          · RootRedirect 默认指向 dashboard
        - src/career/Dashboard.tsx (~220 行):
          · 顶部状态卡:大 ON/OFF + 运行摘要 + [暂停][调参(→Profile)]
          · 4 漏斗数字卡:候选 / 填表中 / 待批准(高亮,→Review)/ 已提交;
            数字来自 GET /autopilot/feed 的 funnel
          · 实时活动流:feed.events 倒序,每条 [去处理]/[查看] 跳对应页
          · 30s 轮询(对齐现有 Overview/Applied cadence)+ AbortController
          · loading/error 骨架
        - src/career/dashboard.css (~80 行,db- 前缀)
        - scripts/smoke-dashboard-page.mjs (~50 行):
          · /autopilot/status + /feed 返回 Dashboard 渲染所需形态
          · enable/disable 翻转后 status.enabled 变化
          · funnel 4 数字 + feed events 渲染;vite build 干净

      验收: smoke 全绿;手动:顶栏开关切换 daemon、Dashboard 显示 4 数字 + 活动流。

  - id: "m2-review-gate-queue"
    name: "Review 人工闸门队列(待提交 / 待回答新问题 / 失败接管 + qa-bank 回写)"
    status: completed
    actual_files:
      - "src/career/Review.tsx (~230 行) + review.css"
      - "server.mjs (GET /autopilot/review + POST /autopilot/bank-answer)"
      - "src/career/applier/multistep/applySessionsStore.mjs (schema +terminal_outcome +escalation_code)"
      - "src/career/applier/multistep/machine.mjs (settle 时持久化 terminal_outcome/escalation_code)"
      - "src/career/CareerNav.tsx (Review tab + 轮询 badge) + src/career.css (.c-nav-badge)"
      - "src/CareerApp.tsx (/review route) + scripts/smoke-review-queue.mjs (4 tests)"
    actual_lines: 600
    review_findings:
      - "[DESIGN] session 磁盘上无 escalation_reason(仅内存),分桶会在重启后错判 → 修:把 terminal_outcome+escalation_code 持久化进 session(schema 加 2 个 optional 字段 + machine settle 时写),review 端点从磁盘读 → 重启安全"
      - "[HIGH→fixed] 失败 session 重启后(无内存 machine)误归到绿色'待提交'(让用户去提交一个其实失败的表)→ terminal_outcome='error' 也归 failed"
      - "[副作用 fixed] 持久化后 review 端点不再每 session 调 getStatus(去掉 2N 磁盘读 / 重启不一致)"
      - "[飞轮 verified] bank-answer 必须写 applier-shape {label,final_answer,class}(draftPrompt.formatHistoryEntry 只认这个),不能用 Settings 的 {field_type,q,a_final} → 用独立 path /autopilot/bank-answer"
      - "[LOW] REVIEW_FAILURE_CODES 漏了真实的 'timeout' 码 → 补上;login_wall/captcha 保留为登录墙 ATS 预留"
      - "[LOW] BankAnswer save() 无 unmount 守卫 + setTimeout 泄漏 → 加 mountedRef + clearTimeout"
      - "[NOTE] 深度逐字段操作仍走现有 Apply 页(/apply/:jobId);Review 是统一收件箱 + 一键直达 + 答案入库飞轮,不重复造"
      - "[regression] apply-sessions-store smoke 58/58(schema 改动向后兼容)"
    estimated_files:
      - "src/career/Review.tsx"
      - "src/career/review.css"
      - "src/career/CareerNav.tsx"
      - "scripts/smoke-review-queue.mjs"
    estimated_lines: 380
    depends_on: ["m1-global-control-bar-and-dashboard"]
    complexity_flags: ["design_decisions"]
    open_questions: []
    description: |
      产品灵魂页。收拢散在 Apply 流程里的人工动作成统一收件箱。布局见 UI-LAYOUT §3.2。
      依赖 10-autopilot-engine m2(parked at submit gate 的会话)+ 现有 multistep
      endpoint(escalation_reason)+ qa-bank。

      Files:
        - src/career/Review.tsx (~270 行):
          · 三类卡片(filter chips: Submit / 问题 / 失败):
            🟢 待提交:读 parked sessions(machine state=done/paused at gate)。
               展示已填字段摘要 + [👀 预览整页][✅ 确认提交(→人工在浏览器点)][✕ 跳过]
            🟡 待回答新问题:machine escalation 里的未答 question;textarea 回答 →
               [💾 保存并继续] = POST 答案回 multistep machine + 回写 qa-bank
               (history.jsonl,飞轮:下次自动填)
            🔴 失败/需接管:escalation_reason=login/captcha → [手动接管→]
          · 30s 轮询;空态/错误态
        - src/career/review.css (~80 行,rv- 前缀;三态色 🟢🟡🔴)
        - src/career/CareerNav.tsx(改):Review tab + 未读角标(待办计数,
          来自 funnel.待批准 + 待回答)
        - scripts/smoke-review-queue.mjs (~80 行):
          · parked session 出现在待提交分组
          · 回答新问题 → qa-bank history 增加一条 + machine 收到答案
          · login-wall escalation → 失败分组
          · 角标计数 = 待提交 + 待回答

      验收: smoke 全绿;手动:一个 parked 申请在 Review 可预览;回答一个新问题后
      qa-bank 多一条且 Review 该项消失。

